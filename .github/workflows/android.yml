name: Crystal Launcher Android Build

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-22.04

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Download LTW artifact
        uses: dawidd6/action-download-artifact@v6
        continue-on-error: true
        with:
          repo: MojoLauncher/LTW
          workflow: android.yml
          workflow_conclusion: success
          name: output-aar
          path: app_pojavlauncher/libs

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.14.3'

      - name: Build full-runtime APK
        run: gradle :app_pojavlauncher:assembleFullDebug

      - name: Build no-runtime APK
        run: gradle :app_pojavlauncher:assembleNoruntimeDebug

      - name: Upload full-runtime APK
        uses: actions/upload-artifact@v4
        with:
          name: crystal-launcher-full
          path: app_pojavlauncher/build/outputs/apk/full/debug/app_pojavlauncher-full-debug.apk
          if-no-files-found: error

      - name: Upload no-runtime APK
        uses: actions/upload-artifact@v4
        with:
          name: crystal-launcher-no-runtime
          path: app_pojavlauncher/build/outputs/apk/noruntime/debug/app_pojavlauncher-noruntime-debug.apk
          if-no-files-found: error
